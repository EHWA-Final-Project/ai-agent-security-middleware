# Policy Config — P0 smoke baseline. NOT final tuned thresholds.
# Any change here must bump policy_version (see Risk Aggregation · P0 규칙).

policy_version: "v0.1.0-p0-baseline"

strict_threshold: 0.50
block_threshold: 0.80

# All guard weights default to 1.0 in P0. Override per guard here if needed.
guard_weights:
  input_guard: 1.0
  context_guard: 1.0
  tool_guard: 1.0
  output_guard: 1.0

# linked (default): risk accumulates across Guards and an earlier WARN
#   raises the inspection mode for later stages.
# independent: each Guard judged alone against the thresholds above.
# A different mode is a different policy -> give it its own policy_version.
coordination_mode: linked
