<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-label="GuardOn | Custom Guard registration">
<rect width="1440" height="620" fill="#f5f7fb"/>
<style>text{font-family:Arial,sans-serif;fill:#18243b}.title{font-size:36px;font-weight:700}.sub{font-size:20px}.label{font-size:22px;font-weight:700}.note{font-size:18px}</style>
<text x="64" y="76" class="title">GuardOn | Custom Guard registration</text>
<text x="64" y="120" class="sub">Example registration / not a service hot-swap capability</text>
<rect x="64" y="205" width="232" height="180" rx="18" fill="white" stroke="#7b91b8" stroke-width="2"/>
<text x="82" y="254" class="label">Implement</text>
<text x="82" y="300" class="note">GuardPlugin subclass</text>
<text x="82" y="328" class="note">name / stage / inspect</text>
<path d="M 303 292 h 20 l -7 -6 m 7 6 l -7 6" fill="none" stroke="#2f64cf" stroke-width="3"/>
<rect x="332" y="205" width="232" height="180" rx="18" fill="white" stroke="#7b91b8" stroke-width="2"/>
<text x="350" y="254" class="label">Register</text>
<text x="350" y="300" class="note">register_guard()</text>
<text x="350" y="328" class="note">Unique plugin name</text>
<path d="M 571 292 h 20 l -7 -6 m 7 6 l -7 6" fill="none" stroke="#2f64cf" stroke-width="3"/>
<rect x="600" y="205" width="232" height="180" rx="18" fill="white" stroke="#7b91b8" stroke-width="2"/>
<text x="618" y="254" class="label">Configure</text>
<text x="618" y="300" class="note">enabled / disabled</text>
<text x="618" y="328" class="note">Registry selection</text>
<path d="M 839 292 h 20 l -7 -6 m 7 6 l -7 6" fill="none" stroke="#2f64cf" stroke-width="3"/>
<rect x="868" y="205" width="232" height="180" rx="18" fill="white" stroke="#7b91b8" stroke-width="2"/>
<text x="886" y="254" class="label">Inspect</text>
<text x="886" y="300" class="note">SecurityResult</text>
<text x="886" y="328" class="note">Failure isolation</text>
<path d="M 1107 292 h 20 l -7 -6 m 7 6 l -7 6" fill="none" stroke="#2f64cf" stroke-width="3"/>
<rect x="1136" y="205" width="232" height="180" rx="18" fill="white" stroke="#7b91b8" stroke-width="2"/>
<text x="1154" y="254" class="label">Enforce</text>
<text x="1154" y="300" class="note">B: independent</text>
<text x="1154" y="328" class="note">C: accumulated risk</text>
<text x="64" y="470" class="sub">Example: examples/custom_guard.py | BlockedTermGuard | INPUT stage</text>
<text x="64" y="504" class="sub">Contract tests cover duplicate names, disabling, B/C differences and plugin failures.</text>
<text x="64" y="538" class="sub">Current Registry describes current source; historical Evidence is not a policy snapshot.</text>
</svg>