<style>text{font-family:Arial,sans-serif;fill:#18243b}.title{font-size:36px;font-weight:700}.sub{font-size:20px}.label{font-size:22px;font-weight:700}.note{font-size:18px}</style>
<text x="64" y="76" class="title">GuardOn | Guard decisions and Runtime enforcement</text>
