<rect x="332" y="205" width="232" height="180" rx="18" fill="white" stroke="#7b91b8" stroke-width="2"/>
<text x="350" y="254" class="label">Plugin Manager</text>
<text x="350" y="300" class="note">Registry + enabled</text>
<text x="350" y="328" class="note">GuardPlugin.inspect()</text>
<path d="M 571 292 h 20 l -7 -6 m 7 6 l -7 6" fill="none" stroke="#2f64cf" stroke-width="3"/>
<rect x="600" y="205" width="232" height="180" rx="18" fill="white" stroke="#7b91b8" stroke-width="2"/>
<text x="618" y="254" class="label">Orchestrator</text>
<text x="618" y="300" class="note">SecurityContext</text>
<text x="618" y="328" class="note">SecurityDecision</text>
<path d="M 839 292 h 20 l -7 -6 m 7 6 l -7 6" fill="none" stroke="#2f64cf" stroke-width="3"/>
<rect x="868" y="205" width="232" height="180" rx="18" fill="white" stroke="#7b91b8" stroke-width="2"/>
<text x="886" y="254" class="label">Runtime</text>
<text x="886" y="300" class="note">Pre-tool decision</text>
<text x="886" y="328" class="note">Mock Tool execution</text>
<path d="M 1107 292 h 20 l -7 -6 m 7 6 l -7 6" fill="none" stroke="#2f64cf" stroke-width="3"/>
<rect x="1136" y="205" width="232" height="180" rx="18" fill="white" stroke="#7b91b8" stroke-width="2"/>
<text x="1154" y="254" class="label">Output + Evidence</text>
<text x="1154" y="300" class="note">Post-tool inspection</text>
<text x="1154" y="328" class="note">SQLite run / trace</text>
<text x="64" y="470" class="sub">Input, Context and Tool Guards inspect before Tool execution; Output Guard inspects afterwards.</text>
<text x="64" y="504" class="sub">WARN can allow a Mock Tool call while withholding its returned output.</text>
<text x="64" y="538" class="sub">Sources: src/security/policy/conditions.py, src/runtime/adapter.py, demo/service.py</text>
