name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  qa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Sync frozen project dependencies
        run: uv sync --frozen

      # Platform API dependencies are installed as a temporary demo overlay.
      # They will be moved into pyproject.toml + uv.lock after the P0 demo gate.
      - name: Install P0 platform demo dependencies
        run: >-
          uv pip install
          "fastapi>=0.118,<1"
          "uvicorn>=0.37,<1"
          "httpx>=0.28,<1"

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -q
